name: Adpick Travel and Services

on:
  workflow_dispatch:
    inputs:
      replay_run_id:
        description: Prior Adpick run to replay before collecting (blank selects recent failed run)
        type: string
        required: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/adpick-catalog.yml'
      - 'adpick*.go'
  schedule:
    - cron: '25 2 * * *'

permissions:
  contents: read
  actions: read

# The other Shopping workflow uses this same group: a single API collector and
# a single writer/replayer own the shared endpoint-local outbox at a time.
concurrency:
  group: statground-shopping-clickhouse-writer-replayer
  cancel-in-progress: false

jobs:
  adpick_catalog:
    if: ${{ github.event_name != 'schedule' || vars.ADPICK_CATALOG_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      INGEST_MODE: clickhouse
      ADPICK_COLLECT_ONLY: 'true'
      # Actual diagnostic searches returned no eligible travel/services offers.
      # Refresh the verified directory with one malls request and zero searches.
      # Focused/expanded search remains opt-in through repository variables.
      ADPICK_QUERY_PROFILE: ${{ vars.ADPICK_QUERY_PROFILE || 'directory' }}
      ADPICK_SEARCH_LIMIT: '20'
      ADPICK_SEARCH_QUERIES_JSON: ${{ vars.ADPICK_SEARCH_QUERIES_JSON || '' }}
      ADPICK_COVERAGE_REPORT: /tmp/adpick-coverage.json
      ADPICK_HARVEST_FILE: /tmp/adpick-harvest.json
      CLICKHOUSE_DIRECT_ENDPOINT_HOSTNAME: clickhouse-s1-r1
      CLICKHOUSE_DIRECT_INSERT_TIMEOUT_SECONDS: '120'
      CLICKHOUSE_DIRECT_INSERT_ATTEMPT_TIMEOUT_SECONDS: '30'
      CLICKHOUSE_PREFLIGHT_RETRY_BUDGET_SECONDS: '90'
      CLICKHOUSE_PREFLIGHT_RETRY_BACKOFF_SECONDS: '5'
      CLICKHOUSE_PRESSURE_GATE_MIN_AVAILABLE_BYTES: '107374182400'
      CLICKHOUSE_PRESSURE_GATE_MAX_USED_RATIO: '0.90'
      CLICKHOUSE_PRESSURE_GATE_MIN_AVAILABLE_INODES: '1000000'
      CLICKHOUSE_PRESSURE_GATE_MAX_USED_INODE_RATIO: '0.95'
      CLICKHOUSE_PRESSURE_GATE_MAX_REPLICA_QUEUE: '2000'
      CLICKHOUSE_PRESSURE_GATE_MAX_REPLICA_DELAY_SECONDS: '900'
      CLICKHOUSE_PRESSURE_GATE_MAX_IOWAIT_NORMALIZED: '0.50'
      CLICKHOUSE_PRESSURE_GATE_TIMEOUT_SECONDS: '15'
      CLICKHOUSE_HOST: ${{ secrets.CLICKHOUSE_HOST || secrets.CH_HOST }}
      CLICKHOUSE_PORT: ${{ secrets.CLICKHOUSE_PORT || secrets.CH_PORT }}
      CLICKHOUSE_PROTOCOL: ${{ secrets.CLICKHOUSE_PROTOCOL || secrets.CH_PROTOCOL || 'http' }}
      CLICKHOUSE_HTTP_URL_PATH: ${{ secrets.CLICKHOUSE_HTTP_URL_PATH || secrets.CH_HTTP_URL_PATH }}
      CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER || secrets.CH_USER }}
      CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD || secrets.CH_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate catalog configuration
        env:
          ADPICK_BIZ_API_KEY: ${{ secrets.ADPICK_API }}
        run: |
          test -n "$ADPICK_BIZ_API_KEY" || { echo 'ADPICK_API secret is required'; exit 1; }
          test -n "$CLICKHOUSE_HOST" || { echo 'CLICKHOUSE_HOST secret is required'; exit 1; }
          test -n "$CLICKHOUSE_PORT" || { echo 'CLICKHOUSE_PORT secret is required'; exit 1; }
          test -n "$CLICKHOUSE_USER" || { echo 'CLICKHOUSE_USER secret is required'; exit 1; }
          test -n "$CLICKHOUSE_PASSWORD" || { echo 'CLICKHOUSE_PASSWORD secret is required'; exit 1; }

      - name: Resolve Go modules and checksums
        run: |
          go mod download all
          go mod verify

      - name: Run tests
        env:
          ADPICK_QUERY_PROFILE: standard
          ADPICK_SEARCH_QUERIES_JSON: ''
          ADPICK_HARVEST_FILE: ''
          ADPICK_COVERAGE_REPORT: ''
        run: go test ./...

      - name: Find prior failed harvest
        id: prior
        uses: actions/github-script@v8
        env:
          REQUESTED_RUN_ID: ${{ inputs.replay_run_id || '' }}
        with:
          script: |
            const requested = process.env.REQUESTED_RUN_ID;
            if (requested && !/^[1-9][0-9]{0,14}$/.test(requested)) {
              throw new Error('Invalid replay run ID');
            }
            const repository = {owner: context.repo.owner, repo: context.repo.repo};
            const owned = run => run.id !== context.runId && run.head_branch === 'main' &&
              run.path === '.github/workflows/adpick-catalog.yml' &&
              run.head_repository?.full_name === `${context.repo.owner}/${context.repo.repo}`;
            let publishedCutoff = 0;
            if (!requested) {
              const successes = (await github.rest.actions.listWorkflowRuns({...repository,
                workflow_id: 'adpick-catalog.yml', status: 'success', per_page: 5})).data.workflow_runs;
              for (const run of successes.filter(owned)) {
                const jobs = (await github.rest.actions.listJobsForWorkflowRun({
                  ...repository, run_id: run.id, per_page: 10})).data.jobs;
                if (jobs.some(job => job.steps?.some(step =>
                    ['Collect verify and publish travel and services catalogs', 'Replay verified prior harvest'].includes(step.name) &&
                    step.conclusion === 'success'))) {
                  publishedCutoff = Math.max(publishedCutoff, run.id);
                }
              }
            }
            const runs = requested
              ? [(await github.rest.actions.getWorkflowRun({...repository, run_id: Number(requested)})).data]
              : (await github.rest.actions.listWorkflowRuns({...repository,
                  workflow_id: 'adpick-catalog.yml', status: 'failure', per_page: 5})).data.workflow_runs;
            let found = false;
            for (const run of runs) {
              if (!owned(run) || (!requested && run.id <= publishedCutoff)) continue;
              const jobs = (await github.rest.actions.listJobsForWorkflowRun({
                ...repository, run_id: run.id, per_page: 10})).data.jobs;
              const executed = jobs.some(job =>
                job.steps?.some(step => step.name === 'Run tests' && step.conclusion === 'success') &&
                job.steps?.some(step =>
                  ['Collect verify and publish travel and services catalogs', 'Replay verified prior harvest'].includes(step.name) &&
                  ['success', 'failure', 'cancelled'].includes(step.conclusion)));
              // Artifacts from a failed test setup are never collection input.
              if (!executed) continue;
              const artifacts = (await github.rest.actions.listWorkflowRunArtifacts({
                ...repository, run_id: run.id, per_page: 20})).data.artifacts;
              const artifact = artifacts.find(item => !item.expired &&
                item.name === `adpick-coverage-${run.id}-${run.run_attempt}` &&
                item.size_in_bytes > 0 && item.size_in_bytes <= 64 * 1024 * 1024);
              if (artifact) {
                core.setOutput('run_id', String(run.id));
                core.setOutput('artifact_name', artifact.name);
                found = true;
                break;
              }
            }
            if (requested && !found) throw new Error('Replay harvest unavailable for this workflow');

      - name: Download prior harvest
        if: ${{ steps.prior.outputs.run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.prior.outputs.artifact_name }}
          run-id: ${{ steps.prior.outputs.run_id }}
          github-token: ${{ github.token }}
          path: /tmp/adpick-replay

      - name: Replay verified prior harvest
        id: replay
        run: |
          if test -f /tmp/adpick-replay/adpick-harvest.json; then
            ADPICK_REPLAY_HARVEST_FILE=/tmp/adpick-replay/adpick-harvest.json go run .
            echo 'published=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Gate ClickHouse catalog writes on storage pressure
        if: ${{ steps.replay.outputs.published != 'true' }}
        env:
          CLICKHOUSE_PRESSURE_GATE_TARGETS: >-
            local:Data_Shopping_Raw.adpick_vertical_catalog_raw_endpoint_history,
            local:Data_Shopping_Service.adpick_vertical_catalog_snapshot,
            local:Data_Shopping_Service.adpick_vertical_catalog_published_batch,
            local:Data_Shopping_Log.shopping_raw_direct_insert_outbox
        run: python3 scripts/clickhouse_pressure_gate.py

      - name: Collect verify and publish travel and services catalogs
        if: ${{ steps.replay.outputs.published != 'true' }}
        env:
          ADPICK_BIZ_API_KEY: ${{ secrets.ADPICK_API }}
        run: go run .

      - name: Summarize actual search coverage
        if: ${{ always() }}
        run: python3 scripts/adpick_coverage_summary.py

      - name: Retain collection coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: adpick-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.ADPICK_COVERAGE_REPORT }}
            ${{ env.ADPICK_HARVEST_FILE }}
          if-no-files-found: warn
          retention-days: 30
