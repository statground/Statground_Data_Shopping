name: Shopping Insight Runtime Verification Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/shopping_insight_runtime_once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: shopping-price-insight-refresh
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve modules and run tests
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          go mod download all
          go mod verify
          go test ./...

      - name: Publish and verify one complete Shopping Price Insight generation
        env:
          SHOPPING_ANALYSIS_REFRESH_ONLY: "true"
          SHOPPING_INSIGHT_OVERLOAD_RETRY_ATTEMPTS: "90"
          SHOPPING_INSIGHT_OVERLOAD_RETRY_BACKOFF_SECONDS: "10"
          CLICKHOUSE_HOST: ${{ secrets.CLICKHOUSE_HOST || secrets.CH_HOST }}
          CLICKHOUSE_PORT: ${{ secrets.CLICKHOUSE_PORT || secrets.CH_PORT }}
          CLICKHOUSE_PROTOCOL: ${{ secrets.CLICKHOUSE_PROTOCOL || secrets.CH_PROTOCOL || 'http' }}
          CLICKHOUSE_HTTP_URL_PATH: ${{ secrets.CLICKHOUSE_HTTP_URL_PATH || secrets.CH_HTTP_URL_PATH }}
          CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER || secrets.CH_USER }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD || secrets.CH_PASSWORD }}
        run: go run .
